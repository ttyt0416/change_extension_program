[package]
name = "convert-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
claxon = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
mp4 = "0.14.0"
office2pdf = "0.7.0"
csv = "1.4.0"
flacenc = "0.5.1"
hound = "3.5.1"
html2text = "0.17.1"
pdf-extract = "0.12.0"
pulldown-cmark = "0.13.4"
roxmltree = "0.21.1"
shine-rs = "0.1.3"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "aiff", "alac", "caf", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
docx-rs = "=0.4.22"
lopdf = { version = "=0.42.0", default-features = false }
